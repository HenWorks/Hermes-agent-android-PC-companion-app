name: build

# Builds a one-click Hermes companion app for macOS, Windows and Linux.
#   macOS  → Hermes Companion.app  (menu-bar agent, double-click to run)
#   Windows→ hermes-companion.exe  (double-click to run)
#   Linux  → hermes-companion.AppImage (double-click to run)
# Each build job zips its own artifact IN-PLACE so Unix exec bits and the .app
# bundle structure survive (actions/upload-artifact strips file permissions).
# On a version tag (v*), the zips are attached to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: hermes-companion-macos
          - os: windows-latest
            asset: hermes-companion-windows
          - os: ubuntu-latest
            asset: hermes-companion-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "PyNaCl>=1.5" "zeroconf>=0.130" "qrcode>=7" "pillow>=9" "pystray>=0.19"

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm hermes-companion.spec

      # ── macOS: build a .dmg (drag-to-Applications) — dmg preserves the bundle +
      #    perms, and running from /Applications avoids Gatekeeper App Translocation
      #    (the cause of the "-47 can't open" on re-install). ──
      - name: Package macOS .dmg
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmgroot
          cp -R "dist/Hermes Companion.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Hermes Companion" -srcfolder dmgroot -ov -format UDZO "${{ matrix.asset }}.dmg"

      # ── Windows: zip the exe ──
      - name: Package Windows exe
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/hermes-companion.exe -DestinationPath ${{ matrix.asset }}.zip
        shell: pwsh

      # ── Linux: wrap the binary into an AppImage, then zip (zip keeps +x) ──
      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          cp dist/hermes-companion AppDir/usr/bin/hermes-companion
          chmod +x AppDir/usr/bin/hermes-companion
          cp packaging/hermes-companion.desktop AppDir/hermes-companion.desktop
          python -c "from PIL import Image,ImageDraw; img=Image.new('RGBA',(256,256),(0,0,0,0)); d=ImageDraw.Draw(img); d.ellipse((24,24,232,232),fill=(59,130,207,255)); d.ellipse((88,88,168,168),fill=(255,255,255,255)); img.save('AppDir/hermes-companion.png')"
          cp AppDir/hermes-companion.png AppDir/.DirIcon
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/hermes-companion" "$@"
          EOF
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir hermes-companion.AppImage
          chmod +x hermes-companion.AppImage
          zip -y ${{ matrix.asset }}.zip hermes-companion.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.zip
            ${{ matrix.asset }}.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p out
          find artifacts \( -name '*.zip' -o -name '*.dmg' \) -exec cp {} out/ \;
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            One-click Hermes companion apps (no Python needed).

            - **macOS** — open **hermes-companion-macos.dmg**, drag **Hermes Companion**
              to **Applications**, then open it from Applications. First launch:
              right-click → **Open** (unsigned app; one-time Gatekeeper approval).
              *To reinstall: quit the running one first (menu-bar icon → Quit).*
            - **Windows** — unzip, double-click **hermes-companion.exe**. If SmartScreen
              appears: **More info** → **Run anyway**.
            - **Linux** — unzip, then run **hermes-companion.AppImage**
              (`chmod +x` if your browser cleared the executable bit).

            The app starts the broker and opens the local browser console automatically;
            scan the QR with the Hermes phone app to connect. Runs in the menu bar / tray.
